<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Hello!</title>
</head>
<body>

<div class="container p-4">
    <div class="row text-center">
        <button id="btnSend" class="btn btn-primary btn-lg btn-block mx-auto col-3">
            START
        </button>
    </div>
    <hr>
    <div class="row">
        <div class="col-md-12">
            <div id="responseContainer" style="min-height: 200px" class="p-3">

            </div>
        </div>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>
</html>


<script>
    const url = "http://localhost:8000/api/cars/";
    const targetUrl = "https://turbo.az/autos";

    const jsonToTable = (data) => {
        console.log(data)
        let table = data?.map(item => `<tr>
                        <td><a href='${item.url}'>${item.url}</a></td>
                        <td>${item.phone_numbers}</td>
                    </tr>`)


        return table.join('');
    }

    $("#btnSend").click(function (e) {
        e.preventDefault();
        $("#responseContainer").html(
            "<div class='spinner-border text-center' role='status'><span class='visually-hidden'>Loading...</span></div>"
        );
        $.ajax({
            type: 'GET',
            url: url,
            data: {
                "url": targetUrl,
                first_page: 1,
                end_page: 1,
            },
            success: function (response) {
                console.log(response);
                $("#responseContainer").html(
                    `<table class="table">
                        <thead>
                        <tr>
                            <th scope="col">URL</th>
                            <th scope="col">PHONE NUMBERS</th>
                        </tr>
                        </thead>
                        <tbody>
                           ${jsonToTable(response.result)}
                        </tbody>
                    </table>`
                )
                $("#btnSend").html("SEND MESSAGE");

            },
            error: function (response) {
                $("#responseContainer").html(
                    "<h1>Error</h1>" +
                    "<p>" + response + "</p>" +
                    "<p>Try again</p>"
                );
            }
        });

    })

</script>
